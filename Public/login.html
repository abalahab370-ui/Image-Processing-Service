<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSpace // Friendly Auth</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#F4F7F4] text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Ambient Background Glows -->
    <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-emerald-500/10 blur-[120px] rounded-full pointer-events-none"></div>
    <div class="absolute -bottom-32 left-1/2 -translate-x-1/2 w-[400px] h-[250px] bg-teal-500/10 blur-[100px] rounded-full pointer-events-none"></div>

    <!-- Main Auth Card -->
    <div class="w-full max-w-md bg-white border border-emerald-950/10 rounded-2xl shadow-xl shadow-emerald-950/5 p-8 sm:p-9 relative z-10">
        
        <!-- Friendly Mode Pill Badge -->
        <div class="mb-4">
            <span id="modeBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold tracking-wide uppercase bg-emerald-100/80 text-emerald-800 border border-emerald-200/60">
                <span id="badgeText">Welcome Back</span>
            </span>
        </div>

        <!-- Conversational Header -->
        <div class="mb-6">
            <h1 id="authTitle" class="text-2xl font-bold tracking-tight text-slate-900 leading-tight">Good to see you again!</h1>
            <p id="authSubtitle" class="text-xs text-slate-500 mt-1.5 leading-relaxed">
                Enter your details below to jump straight back into your image workspace.
            </p>
        </div>

        <!-- Form -->
        <form id="authForm" class="space-y-4">
            
            <!-- Username Input -->
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 mb-1 uppercase tracking-wider">Username or email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input 
                        type="text" 
                        id="username" 
                        required
                        placeholder="e.g. alex_dev"
                        class="w-full bg-slate-50/80 border border-slate-200 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/15 focus:outline-none transition-all duration-150"
                    >
                </div>
                <p id="usernameHint" class="text-[11px] text-slate-400 mt-1">The username or email address you used when signing up.</p>
            </div>

            <!-- Password Input -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
                    <a href="#" id="forgotBtn" class="text-xs text-emerald-700 hover:text-emerald-800 transition-colors font-semibold">Forgot password?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        required
                        placeholder="••••••••"
                        class="w-full bg-slate-50/80 border border-slate-200 rounded-xl pl-10 pr-10 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/15 focus:outline-none transition-all duration-150"
                    >
                    <button type="button" onclick="togglePasswordVisibility('password')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Confirm Password Field (Only during Registration) -->
            <div id="confirmPasswordGroup" class="hidden opacity-0 transition-all duration-200">
                <label for="confirmPassword" class="block text-xs font-semibold text-slate-700 mb-1 uppercase tracking-wider">Confirm Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                    </div>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        placeholder="••••••••"
                        class="w-full bg-slate-50/80 border border-slate-200 rounded-xl pl-10 pr-10 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/15 focus:outline-none transition-all duration-150"
                    >
                </div>
                <p class="text-[11px] text-emerald-700 font-medium mt-1">Make sure both passwords match so you don't get locked out!</p>
            </div>

            <!-- Action Button -->
            <button 
                type="submit" 
                id="submitBtn" 
                class="w-full bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white font-semibold py-3 rounded-xl text-sm transition-all duration-150 shadow-md shadow-emerald-700/20 active:scale-[0.98] cursor-pointer mt-2 flex items-center justify-center gap-2"
            >
                <span>Let's Go</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>

        <!-- Conversational Footer Switcher -->
        <div class="mt-8 pt-5 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500 leading-relaxed">
                <span id="togglePrefix">New around here?</span>
                <button type="button" id="toggleAuthMode" class="text-emerald-700 hover:text-emerald-800 font-bold ml-1 cursor-pointer transition-colors focus:outline-none underline underline-offset-2">
                    Create your account in 30 seconds
                </button>
            </p>
        </div>

    </div>

    <!-- Micro-UX Visual State Animations -->
    <script>
        let isLoginUI = true;

        const badgeText = document.getElementById('badgeText');
        const usernameHint = document.getElementById('usernameHint');
        const togglePrefix = document.getElementById('togglePrefix');
        const forgotBtn = document.getElementById('forgotBtn');
        const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');

        function togglePasswordVisibility(id) {
            const field = document.getElementById(id);
            if (field) field.type = field.type === 'password' ? 'text' : 'password';
        }

        // Handles smooth visual field transitions when toggle button is clicked
        document.getElementById('toggleAuthMode')?.addEventListener('click', () => {
            isLoginUI = !isLoginUI;

            if (isLoginUI) {
                if (badgeText) badgeText.textContent = 'Welcome Back';
                if (usernameHint) usernameHint.textContent = 'The username or email address you used when signing up.';
                if (togglePrefix) togglePrefix.textContent = 'New around here?';
                if (forgotBtn) forgotBtn.classList.remove('hidden');

                if (confirmPasswordGroup) {
                    confirmPasswordGroup.classList.add('opacity-0');
                    setTimeout(() => confirmPasswordGroup.classList.add('hidden'), 150);
                }
            } else {
                if (badgeText) badgeText.textContent = 'Quick Setup';
                if (usernameHint) usernameHint.textContent = 'Pick a unique username or enter your primary email address.';
                if (togglePrefix) togglePrefix.textContent = 'Already have an account?';
                if (forgotBtn) forgotBtn.classList.add('hidden');

                if (confirmPasswordGroup) {
                    confirmPasswordGroup.classList.remove('hidden');
                    setTimeout(() => confirmPasswordGroup.classList.remove('opacity-0'), 10);
                }
            }
        });
    </script>

    <!-- Connect External JS File -->
    <script src="app.js"></script>
    <script>
        // Initialize the auth submit and logic handlers from app.js
        initAuthPage();
    </script>
</body>
</html>
